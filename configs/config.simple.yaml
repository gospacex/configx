# ============================================================
# HubX 简单单机配置文件
# 适用于本地开发，单机 docker-compose 环境
# ============================================================

# ===== 应用配置 =====
app:
  name: myapp
  version: 1.0.0
  env: development

# ===== 调用链统一开关（全局总闸）=====
# traceflag.enabled 是所有 x 系列 SDK 调用链的全局总闸：
# 缺省不写 = 放行（opt-out）；显式 enabled: false = 一键熔断全部组件。
# 各 SDK 段级/实例级开关键一律 enable_trace（详见各段）。
traceflag:
  enabled: true

# ===== 配置中心（本地模式）=====
configx:
  remote:
    enabled: false
    provider: nacos
    nacos:
      server_configs:
        - ip: localhost
          port: 8848
      namespace_id: ""
      group: "DEFAULT_GROUP"
      data_id: "myapp"
      refresh_interval: 30s

# ===== 日志配置 =====
logx:
  level: debug
  format: console
  output: stdout
  file_path: ./logs/app.log
  max_size: 50
  max_backups: 3
  max_age: 7
  compress: false
  otel:
    # 调用链开关键统一为 enable_trace（enabled 为旧键，保留为兼容别名）
    enable_trace: false
    exporter: jaeger
    jaeger:
      endpoint: "http://localhost:14268/api/traces"

# ===== x 系列中间件配置 =====
xmiddleware:

  # ----- sqlx（SQL 数据库）-----
  sqlx:
    driver: gorm
    databases:
      default:
        dsn: "root:rootpass@tcp(localhost:3306)/testdb?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 100
        max_idle_conns: 25
        conn_max_lifetime: 5m
        conn_max_idle_time: 3m
        slow_threshold: 200ms
        enable_log: true
        log_level: debug
        enable_trace: false

  # ----- cachex（缓存）-----
  cachex:
    driver: redis
    instances:
      default:
        addr: "localhost:6379"
        password: "redis123456"
        db: 0
        pool_size: 100
        min_idle_conns: 10
        pool_timeout: 30s
        idle_timeout: 5m
        max_retries: 3
        dial_timeout: 5s
        read_timeout: 3s
        write_timeout: 3s
        tls:
          enabled: false
        sentinel:
          enabled: false
        slow_threshold: 100ms
        enable_trace: false

  # ----- mqx（消息队列）-----
  mqx:
    driver: kafka
    instances:
      default:
        brokers:
          - "localhost:9092"
        producer:
          topic: "default"
          batch_size: 100
          batch_timeout: 10ms
          max_retries: 3
          retry_backoff: 100ms
          required_acks: 1
          compression: none
        consumer:
          group_id: "myapp-group"
          topics:
            - "default"
          auto_commit: true
          max_concurrency: 5
          session_timeout: 30s
          heartbeat_interval: 10s
        tls:
          enabled: false
        enable_trace: false

  # ----- coordx（服务协调）-----
  coordx:
    driver: nacos
    instances:
      default:
        server_configs:
          - ip: localhost
            port: 8848
        namespace_id: ""
        group: "DEFAULT_GROUP"
        retry:
          enabled: true
          max_attempts: 3
          initial_delay: 1s
          max_delay: 10s
          multiplier: 2.0
        heartbeat:
          enabled: true
          interval: 10s
        enable_trace: false

  # ----- lockx（分布式锁）-----
  lockx:
    driver: redis
    instances:
      default:
        reuse: "cachex.default"
        expiry: 10s
        retries: 3
        retry_delay: 100ms
        watchdog:
          enabled: true
          interval: 3s
        health_check:
          enabled: true
          interval: 30s

  # ----- configx（配置中心）-----
  configx:
    driver: viper
    instances:
      default:
        config_file: "configs/config.yaml"
        config_type: "yaml"
        watch: true
        watch_interval: 10s

  # ----- otelx（可观测性）-----
  # 代码契约：otelx 段为扁平结构（service_name / tracer / meter / sampler），
  # 调用链开关键统一为 enable_trace（tracer.enabled 为旧键，保留为兼容别名）
  otelx:
    service_name: "myapp"
    service_version: "1.0.0"
    environment: "development"
    tracer:
      enable_trace: false
      exported: "otlp"
      endpoint: "localhost:4317"
      protocol: "grpc"
      timeout: 10s
      insecure: true
    meter:
      enabled: true
    sampler:
      type: "traceidratio"
      ratio: 1.0

  # ----- searchx（搜索引擎）-----
  searchx:
    driver: elasticsearch
    instances:
      default:
        addresses:
          - "http://localhost:9200"
        username: ""
        password: ""
        max_idle_conns: 10
        idle_timeout: 5m
        dial_timeout: 5s
        read_timeout: 10s
        write_timeout: 10s
        retry:
          enabled: true
          max_attempts: 3
          initial_delay: 500ms
        tls:
          enabled: false
        enable_trace: false

  # ----- objectx（对象存储）-----
  objectx:
    driver: minio
    instances:
      default:
        endpoint: "localhost:9000"
        access_key: "minioadmin"
        secret_key: "minioadmin123"
        use_ssl: false
        bucket: "myapp"
        max_idle_conns: 10
        idle_timeout: 5m
        retry:
          enabled: true
          max_attempts: 3
        max_upload_size: 100MB
        presigned_expiry: 1h
        enable_trace: false

  # ----- docx（文档数据库）-----
  docx:
    driver: mongodb
    instances:
      default:
        uri: "mongodb://localhost:27017"
        database: "test"
        max_pool_size: 100
        min_pool_size: 10
        max_conn_idle_time: 5m
        connect_timeout: 10s
        socket_timeout: 30s
        retry:
          enabled: true
          max_attempts: 3
          initial_delay: 1s
        read_preference: "primary"
        write_concern: "majority"
        enable_trace: false

  # ----- kvx（KV 存储）-----
  kvx:
    driver: etcd
    instances:
      default:
        endpoints:
          - "localhost:2379"
        dial_timeout: 5s
        tls:
          enabled: false
        session:
          ttl: 30s
          keep_alive: 10s
        enable_trace: false

  # ----- vectorx（向量数据库）-----
  vectorx:
    driver: milvus
    instances:
      default:
        address: "localhost:19530"
        pool_size: 10
        dial_timeout: 5s
        tls:
          enabled: false
        enable_trace: false

  # ----- protocolx（协议）-----
  protocolx:
    driver: http
    instances:
      default:
        timeout: 30s
        max_idle_conns: 100
        idle_conn_timeout: 90s
        retry:
          enabled: true
          max_attempts: 3
        circuit_breaker:
          enabled: true
          threshold: 5
          timeout: 30s
